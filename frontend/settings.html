<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS — Settings</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header fade-up">
      <div>
        <div class="eyebrow">Account</div>
        <h1>Settings</h1>
      </div>
    </div>

    <div class="card fade-up fade-up-1">
      <div class="settings-list">

        <div class="settings-row settings-row-column">
          <div>
            <h3>Change Passcode</h3>
            <p>Update the passcode used to unlock LifeOS on this device.</p>
          </div>

          <form id="passcode-form" class="passcode-form">
            <input type="password" id="current-passcode" inputmode="numeric" placeholder="Current passcode" required>
            <input type="password" id="new-passcode" inputmode="numeric" placeholder="New passcode (min 6 characters)" required>
            <input type="password" id="confirm-passcode" inputmode="numeric" placeholder="Confirm new passcode" required>
            <div class="passcode-message" id="passcode-message"></div>
            <button type="submit" class="btn-secondary">Update Passcode</button>
          </form>
        </div>

        <div class="settings-row">
          <div>
            <h3>Version</h3>
            <p>LifeOS v1.0 — Core app</p>
          </div>
        </div>

        <div class="settings-row">
          <div>
            <h3>Log out</h3>
            <p>End your current session on this device.</p>
          </div>
          <button class="btn-secondary" id="logout-btn">Log out</button>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
