<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS — Financial Time Explorer</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/financial-time-explorer.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">

    <div class="page-header">
      <div>
        <div class="eyebrow">WEALTH SIMULATION</div>
        <h1>Financial Time Explorer</h1>
      </div>
    </div>
    <p class="fte-subtitle">Tap any date — days, months, even years out — to see your projected Trade Guardian capital.</p>

    <div class="fte-milestone" id="fteMilestone">🔥 Loading…</div>

    <section class="card fte-card">
      <div class="fte-nav-row">
        <div class="fte-ym" id="fteYmLabel">—</div>
        <div class="fte-nav-btns">
          <button id="ftePrevY" type="button" title="Previous year">«</button>
          <button id="ftePrevM" type="button" title="Previous month">‹</button>
          <button id="fteNextM" type="button" title="Next month">›</button>
          <button id="fteNextY" type="button" title="Next year">»</button>
        </div>
      </div>

      <div class="fte-jump-row">
        <button class="fte-jump" id="fteJumpToggle" type="button">Jump to date</button>
      </div>
      <div class="fte-jump-input" id="fteJumpInput">
        <input type="date" id="fteJumpDate">
        <button id="fteJumpGo" type="button">Go</button>
      </div>

      <div class="fte-dow">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="fte-grid" id="fteGrid"></div>

      <div class="fte-legend">
        <span><i class="fte-sw fte-p1"></i>Growth phase</span>
        <span><i class="fte-sw fte-p2"></i>Diversified</span>
        <span><i class="fte-sw fte-ms"></i>₹3L milestone</span>
        <span><i class="fte-sw fte-good"></i>Ahead of plan</span>
        <span><i class="fte-sw fte-bad"></i>Behind plan</span>
      </div>
    </section>

    <section class="card fte-detail" id="fteDetail">
      <div class="fte-dhead" id="fteDHead">—</div>
      <span class="fte-dtag" id="fteDTag">—</span>
      <div class="fte-total" id="fteTotal">₹0</div>
      <div class="fte-rows" id="fteRows"></div>
    </section>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/financial-time-explorer.js"></script>
</body>
</html>
