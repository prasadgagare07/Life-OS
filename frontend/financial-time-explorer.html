<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financial Time Explorer</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/cards.css">

<style>

main{
max-width:1200px;
margin:auto;
padding:30px;
}

h1{
font-size:38px;
margin-bottom:8px;
}

.subtitle{
opacity:.7;
margin-bottom:30px;
}

.date-box{
margin-bottom:25px;
}

input[type=date]{

width:260px;
padding:12px;

border-radius:12px;

border:none;

font-size:16px;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:20px;

}

.card{

padding:24px;

border-radius:20px;

background:#181818;

}

.label{

opacity:.7;

margin-bottom:10px;

}

.amount{

font-size:36px;

font-weight:700;

}

.info{

margin-top:30px;

padding:22px;

border-radius:20px;

background:#181818;

}

</style>

</head>

<body>

<div id="sidebar"></div>

<main>

<h1>Financial Time Explorer</h1>

<div class="subtitle">

Select any date to view your estimated financial position.

</div>

<div class="date-box">

<input id="simulationDate" type="date">

</div>

<div class="grid">

<div class="card">

<div class="label">

Freedom Fund

</div>

<div id="freedomFund" class="amount">

₹0

</div>

</div>

<div class="card">

<div class="label">

Savings

</div>

<div id="savings" class="amount">

₹0

</div>

</div>

<div class="card">

<div class="label">

Emergency Fund

</div>

<div id="emergencyFund" class="amount">

₹0

</div>

</div>

</div>

<div class="info">

<h3 id="comparisonTitle">Loading...</h3>
<p id="comparisonMessage">Please wait...</p>

</div>

</main>

<script src="js/sidebar.js"></script>
<script src="js/financial-time-explorer.js"></script>

</body>

</html>
