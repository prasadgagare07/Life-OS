<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS — Dashboard</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header fade-up">
      <div>
        <div class="eyebrow" id="today-date">Today</div>
        <h1>Welcome back</h1>
      </div>
    </div>

    <div class="quote-banner fade-up fade-up-1">"<span id="quote"></span>"</div>

    <div class="grid grid-3">
      <div class="card overview-card fade-up fade-up-1">
        <div class="card-title"><h3>🌱 Daily Standards</h3></div>
        <div class="sunrise-arc" id="standards-arc"></div>
        <div class="stat-label" id="standards-status">Loading…</div>
      </div>

      <div class="card overview-card fade-up fade-up-2">
        <div class="card-title"><h3>💰 Finance</h3></div>
        <div class="sunrise-arc" id="finance-arc"></div>
        <div class="stat-value" id="finance-total"></div>
        <div class="stat-label" id="finance-goal">Loading…</div>
      </div>

      <div class="card overview-card fade-up fade-up-3">
        <div class="card-title"><h3>💪 Fitness</h3></div>
        <div class="sunrise-arc" id="fitness-arc"></div>
        <div class="stat-label" id="fitness-status">Loading…</div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/quotes.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
