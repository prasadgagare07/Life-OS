<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BetterMe — LifeOS</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-width:0;

  background:#090b16;
  color:#eef0fb;

  font-family:'Inter',sans-serif;

  overflow-x:hidden;
}

body{
  padding-bottom:60px;
}

:root{

  --bg:#090b16;

  --card:#111629;

  --card2:#161c33;

  --card3:#1a203a;

  --border:#252c4d;

  --muted:#858cad;

  --text:#eef0fb;

  --blue:#3b82f6;

  --purple:#a855f7;

  --pink:#ec4899;

  --green:#22c55e;

  --green2:#4ade80;

  --red:#ef4444;

  --red2:#fb7185;

  --yellow:#fbbf24;

  --dot:#222943;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

  height:64px;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 20px;

  border-bottom:1px solid var(--border);

  background:
    rgba(9,11,22,.92);

  backdrop-filter:blur(14px);

  position:sticky;

  top:0;

  z-index:100;
}

.back-link{

  color:var(--muted);

  text-decoration:none;

  font-size:12px;

  font-weight:700;
}

.back-link:hover{
  color:#fff;
}

.save-pill{

  display:flex;

  align-items:center;

  gap:7px;

  padding:6px 11px;

  border-radius:999px;

  background:rgba(34,197,94,.08);

  border:1px solid rgba(34,197,94,.25);

  color:#86efac;

  font-family:'JetBrains Mono',monospace;

  font-size:10px;

  font-weight:700;
}

.save-pill.saving{

  color:#fbbf24;

  border-color:
    rgba(251,191,36,.3);

  background:
    rgba(251,191,36,.08);
}

.save-pill.error{

  color:#fb7185;

  border-color:
    rgba(248,113,113,.3);

  background:
    rgba(248,113,113,.08);
}

.save-pill .dot{

  width:6px;
  height:6px;

  border-radius:50%;

  background:#4ade80;

  box-shadow:
    0 0 8px #4ade80;
}


/* =========================================================
   HERO
========================================================= */

.hero{

  width:100%;

  max-width:1100px;

  margin:auto;

  padding:38px 20px 20px;

  text-align:center;

  position:relative;
}

.hero::before{

  content:'';

  position:absolute;

  top:-80px;

  left:50%;

  transform:translateX(-50%);

  width:450px;

  height:250px;

  background:
    radial-gradient(
      circle,
      rgba(59,130,246,.20),
      transparent 65%
    );

  filter:blur(25px);

  pointer-events:none;
}

.hero-logo{

  width:70px;

  height:70px;

  object-fit:contain;

  position:relative;

  filter:
    drop-shadow(
      0 8px 25px
      rgba(168,85,247,.35)
    );
}

.hero h1{

  margin-top:6px;

  font-family:'Fredoka',sans-serif;

  font-size:36px;

  font-weight:700;

  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #a855f7,
      #ec4899,
      #fbbf24
    );

  -webkit-background-clip:text;

  background-clip:text;

  -webkit-text-fill-color:transparent;
}

.tagline{

  display:inline-flex;

  margin-top:9px;

  padding:7px 15px;

  border-radius:999px;

  border:1px solid
    rgba(251,191,36,.3);

  background:
    rgba(251,191,36,.07);

  color:#fde68a;

  font-size:10px;

  font-weight:700;
}


/* =========================================================
   SECTION
========================================================= */

.main{

  width:100%;

  max-width:1100px;

  margin:auto;

  padding:0 20px;
}

.section-title{

  display:flex;

  align-items:center;

  gap:10px;

  margin-top:20px;

  font-family:'Fredoka',sans-serif;

  font-size:22px;

  font-weight:600;
}

.title-line{

  width:9px;

  height:28px;

  border-radius:8px;

  background:
    linear-gradient(
      180deg,
      #3b82f6,
      #8b5cf6
    );
}


/* =========================================================
   WEEK SLIDER
========================================================= */

.week-slider-wrap{

  margin-top:20px;

  position:relative;
}

.week-slider{

  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:3px 2px 10px;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.week-slider::-webkit-scrollbar{
  display:none;
}

.week-chip{

  flex:0 0 auto;

  min-width:82px;

  padding:10px 9px;

  border-radius:15px;

  border:1px solid var(--border);

  background:var(--card);

  text-align:center;

  cursor:pointer;

  transition:.18s ease;
}

.week-chip:hover{
  border-color:#3b82f6;
}

.week-chip.active{

  border-color:#3b82f6;

  background:
    rgba(59,130,246,.13);

  box-shadow:
    0 8px 22px
    rgba(59,130,246,.12);
}

.week-chip .wc-title{

  font-family:'Fredoka',sans-serif;

  font-size:11px;

  font-weight:600;

  color:#dce3ff;
}

.week-chip .wc-date{

  margin-top:3px;

  font-family:'JetBrains Mono',monospace;

  font-size:8px;

  color:var(--muted);
}

.week-chip .wc-score{

  margin-top:5px;

  font-family:'JetBrains Mono',monospace;

  font-size:9px;

  font-weight:800;
}


/* =========================================================
   WEEK NAVIGATION
========================================================= */

.week-nav{

  margin-top:4px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  padding:10px;

  border-radius:17px;

  border:1px solid var(--border);

  background:var(--card);
}

.nav-btn{

  width:34px;
  height:34px;

  border-radius:10px;

  border:1px solid var(--border);

  background:var(--card2);

  color:#fff;

  font-size:17px;

  cursor:pointer;
}

.nav-btn:hover{

  border-color:#3b82f6;

  background:
    rgba(59,130,246,.12);
}

.week-label{

  min-width:190px;

  text-align:center;

  font-family:'JetBrains Mono',monospace;

  font-size:11px;

  font-weight:700;

  color:#e5e7ff;
}

.today-btn{

  height:34px;

  padding:0 13px;

  border-radius:10px;

  border:1px solid
    rgba(59,130,246,.35);

  background:
    rgba(59,130,246,.1);

  color:#93c5fd;

  font-size:10px;

  font-weight:800;

  cursor:pointer;
}


/* =========================================================
   HABIT LIST — TOP
========================================================= */

.habits-card{

  margin-top:20px;

  padding:16px;

  border-radius:20px;

  border:1px solid var(--border);

  background:
    linear-gradient(
      145deg,
      #13182d,
      #101426
    );

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.18);
}

.habits-heading{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:13px;
}

.habits-heading-title{

  font-family:'Fredoka',sans-serif;

  font-size:15px;

  font-weight:600;
}

.habits-count{

  font-family:'JetBrains Mono',monospace;

  color:var(--muted);

  font-size:9px;
}

.habit-list{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.habit-chip{

  display:flex;

  align-items:center;

  gap:5px;

  min-width:0;

  padding:6px 8px;

  border-radius:9px;

  border:1px solid #252c4d;

  background:#10152a;

  max-width:100%;
}

.habit-number{

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  width:19px;
  height:19px;

  border-radius:6px;

  background:
    rgba(59,130,246,.14);

  border:1px solid
    rgba(59,130,246,.25);

  color:#93c5fd;

  font-family:'JetBrains Mono',monospace;

  font-size:8px;

  font-weight:800;
}

.habit-name{

  font-size:10px;

  color:#e7e9f7;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   TRACKER
========================================================= */

.tracker-shell{

  margin-top:18px;

  width:100%;

  overflow-x:auto;

  padding-bottom:8px;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:thin;
}

.tracker{

  min-width:680px;

  display:grid;

  grid-template-columns:
    repeat(7,minmax(84px,1fr));

  gap:8px;
}


/* =========================================================
   DAY COLUMN
========================================================= */

.day-column{

  position:relative;

  border-radius:18px;

  border:1px solid var(--border);

  background:
    linear-gradient(
      180deg,
      #141a30,
      #101528
    );

  padding:10px 8px 11px;

  overflow:hidden;
}

.day-column.today{

  border-color:
    rgba(59,130,246,.55);

  box-shadow:
    0 0 0 1px
    rgba(59,130,246,.08),
    0 12px 30px
    rgba(59,130,246,.08);
}

.day-column.locked{

  border-color:
    rgba(34,197,94,.35);

  background:
    linear-gradient(
      180deg,
      rgba(34,197,94,.08),
      #101528
    );
}


/* =========================================================
   DAY HEADER
========================================================= */

.day-header{

  text-align:center;

  padding-bottom:9px;

  border-bottom:1px solid
    rgba(255,255,255,.06);
}

.day-name{

  font-family:'Fredoka',sans-serif;

  font-size:12px;

  font-weight:600;

  color:#f0f2ff;
}

.day-date{

  margin-top:2px;

  font-family:'JetBrains Mono',monospace;

  font-size:8px;

  color:var(--muted);
}

.day-percent{

  margin-top:5px;

  font-family:'JetBrains Mono',monospace;

  font-size:10px;

  font-weight:800;
}


/* =========================================================
   DOT TRACK
========================================================= */

.dot-track{

  position:relative;

  margin-top:12px;

  padding:2px 0;
}

/* CONNECTING LINE */

.dot-track::before{

  content:'';

  position:absolute;

  top:8px;

  bottom:8px;

  left:50%;

  transform:translateX(-50%);

  width:2px;

  background:
    linear-gradient(
      180deg,
      rgba(59,130,246,.28),
      rgba(168,85,247,.18)
    );

  border-radius:3px;
}

/* UPCOMING DAYS — faint connecting line */

.day-column.future
.dot-track::before{

  opacity:.32;

}


/* =========================================================
   HABIT DOT ROW
========================================================= */

.dot-row{

  position:relative;

  height:27px;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:2;
}

.habit-dot{

  position:relative;

  width:21px;

  height:21px;

  border-radius:50%;

  border:2px solid #343b5e;

  background:#20263e;

  display:flex;

  align-items:center;

  justify-content:center;

  font-family:'JetBrains Mono',monospace;

  font-size:7px;

  font-weight:800;

  color:#737b9f;

  cursor:pointer;

  transition:
    transform .12s ease,
    background .12s ease,
    border-color .12s ease,
    box-shadow .12s ease;
}

.habit-dot:hover{

  transform:scale(1.16);

  border-color:#60a5fa;

  z-index:5;
}


/* DONE */

.habit-dot.done{

  background:
    linear-gradient(
      145deg,
      #4ade80,
      #16a34a
    );

  border-color:#4ade80;

  color:#06140b;

  box-shadow:
    0 0 12px
    rgba(34,197,94,.28);
}


/* MISSED */

.habit-dot.missed{

  background:
    linear-gradient(
      145deg,
      #fb7185,
      #dc2626
    );

  border-color:#fb7185;

  color:#210508;

  box-shadow:
    0 0 10px
    rgba(239,68,68,.2);
}


/* LOCKED */

.day-column.locked
.habit-dot{

  cursor:not-allowed;
}

.day-column.locked
.habit-dot:hover{

  transform:none;
}


/* =========================================================
   SAVE DAY
========================================================= */

.save-day-btn{

  width:100%;

  margin-top:11px;

  height:34px;

  border-radius:10px;

  border:1px solid
    rgba(59,130,246,.35);

  background:
    rgba(59,130,246,.10);

  color:#93c5fd;

  font-family:'Inter',sans-serif;

  font-size:9px;

  font-weight:800;

  cursor:pointer;

  transition:.15s ease;
}

.save-day-btn:hover{

  background:
    rgba(59,130,246,.18);

  border-color:#3b82f6;
}

.save-day-btn.locked{

  color:#86efac;

  border-color:
    rgba(34,197,94,.28);

  background:
    rgba(34,197,94,.08);

  cursor:default;
}


/* =========================================================
   ADD HABIT
========================================================= */

.actions{

  display:flex;

  gap:9px;

  margin-top:15px;
}

.action-btn{

  padding:10px 15px;

  border-radius:11px;

  border:1px dashed
    rgba(59,130,246,.4);

  background:
    rgba(59,130,246,.07);

  color:#93c5fd;

  font-size:10px;

  font-weight:800;

  cursor:pointer;
}

.action-btn:hover{

  background:
    rgba(59,130,246,.14);
}


/* =========================================================
   LEGEND
========================================================= */

.legend{

  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:13px;

  margin-top:14px;

  color:var(--muted);

  font-family:'JetBrains Mono',monospace;

  font-size:8.5px;
}

.legend-item{

  display:flex;

  align-items:center;

  gap:5px;
}

.legend-dot{

  width:10px;

  height:10px;

  border-radius:50%;

  background:#20263e;

  border:1px solid #343b5e;
}

.legend-dot.done{

  background:#22c55e;

  border-color:#4ade80;
}

.legend-dot.missed{

  background:#ef4444;

  border-color:#fb7185;
}

.legend-lock{

  font-size:11px;
}


/* =========================================================
   WEEK MOTIVATION
========================================================= */

.motivation{

  margin-top:18px;

  padding:16px;

  border-radius:17px;

  border:1px solid
    rgba(168,85,247,.18);

  background:
    linear-gradient(
      135deg,
      rgba(59,130,246,.08),
      rgba(168,85,247,.07),
      rgba(236,72,153,.05)
    );

  text-align:center;
}

.motivation-main{

  font-family:'Fredoka',sans-serif;

  font-size:16px;

  font-weight:600;

  color:#f2f3ff;
}

.motivation-sub{

  margin-top:4px;

  font-size:9px;

  color:var(--muted);
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

  margin-top:20px;

  padding:30px;

  text-align:center;

  border:1px dashed var(--border);

  border-radius:18px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:850px){

  .habit-chip{

    max-width:250px;
  }

  .habit-name{

    font-size:10.5px;
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .topbar{

    padding:0 15px;
  }

  .hero{

    padding:
      30px 15px 14px;
  }

  .hero-logo{

    width:62px;
    height:62px;
  }

  .hero h1{

    font-size:31px;
  }

  .main{

    padding:0 12px;
  }

  .section-title{

    font-size:20px;
  }

  .week-chip{

    min-width:74px;

    padding:9px 7px;
  }

  .week-nav{

    gap:6px;
  }

  .week-label{

    min-width:145px;

    font-size:9px;
  }

  .habits-card{

    padding:12px;
  }

  .habit-list{

    gap:5px;
  }

  .habit-chip{

    padding:5px 6px;

    max-width:
      calc(50% - 3px);
  }

  .habit-name{

    max-width:100px;

    font-size:8.5px;
  }

  .habit-number{

    width:18px;
    height:18px;

    font-size:7px;
  }

  .tracker-shell{

    margin-left:-2px;

    margin-right:-2px;

    width:
      calc(100% + 4px);
  }

  .tracker{

    min-width:650px;
  }

  .day-column{

    padding:
      9px 6px 10px;
  }

}


/* =========================================================
   VERY SMALL
========================================================= */

@media(max-width:380px){

  .week-label{

    min-width:125px;

    font-size:8px;
  }

  .habit-chip{

    max-width:100%;
  }

}
/* =========================================================
   GOALS
========================================================= */

.goals-section{
  margin-top:30px;
}

.goals-tabs{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.goal-tab{
  flex:1;
  padding:11px 8px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}

.goal-tab.active{
  color:#fff;
  border-color:#3b82f6;
  background:rgba(59,130,246,.13);
}

.goals-list{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.goal-card{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  border-radius:15px;
  border:1px solid var(--border);
  background:var(--card);
}

.goal-check{
  width:27px;
  height:27px;
  flex-shrink:0;
  border-radius:9px;
  border:1px solid #343b5e;
  background:#20263e;
  color:#fff;
  cursor:pointer;
}

.goal-card.completed{
  opacity:.65;
}

.goal-card.completed .goal-check{
  background:#22c55e;
  border-color:#4ade80;
  color:#06140b;
}

.goal-info{
  flex:1;
  min-width:0;
}

.goal-title{
  font-size:11px;
  font-weight:700;
  color:#eef0fb;
}

.goal-deadline{
  margin-top:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:8px;
  color:var(--muted);
}

.goal-actions{
  display:flex;
  gap:5px;
}

.goal-action{
  width:28px;
  height:28px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card2);
  color:#cbd5e1;
  cursor:pointer;
}

.add-goal-btn{
  width:100%;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  border:1px dashed rgba(59,130,246,.4);
  background:rgba(59,130,246,.07);
  color:#93c5fd;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}

.add-goal-btn:hover{
  background:rgba(59,130,246,.14);
}
</style>

</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

  <a
    href="dashboard.html"
    class="back-link"
  >
    ← Life-OS
  </a>

  <div
    class="save-pill"
    id="savePill"
  >

    <span class="dot"></span>

    Saved

  </div>

</div>


<!-- =====================================================
     HERO
===================================================== -->

<div class="hero">

  <img
    class="hero-logo"
    src="assets/betterme-logo.png"
    alt="BetterMe"
    onerror="this.style.display='none'"
  >

  <h1>
    BetterMe
  </h1>

  <div class="tagline">
    ✦ Build Yourself, One Day at a Time ✦
  </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


  <div class="section-title">

    <span class="title-line"></span>

    Daily Habits

  </div>


  <!-- ===================================================
       WEEK SLIDER
  =================================================== -->

  <div class="week-slider-wrap">

    <div
      class="week-slider"
      id="weekSlider"
    ></div>

  </div>


  <!-- ===================================================
       WEEK NAV
  =================================================== -->

  <div class="week-nav">

    <button
      class="nav-btn"
      id="prevWeek"
    >
      ‹
    </button>

    <div
      class="week-label"
      id="weekLabel"
    >
      —
    </div>

    <button
      class="nav-btn"
      id="nextWeek"
    >
      ›
    </button>

    <button
      class="today-btn"
      id="todayBtn"
    >
      Today
    </button>

  </div>


  <!-- ===================================================
       HABITS TOP
  =================================================== -->

  <div class="habits-card">

    <div class="habits-heading">

      <div class="habits-heading-title">
        Your Habits
      </div>

      <div
        class="habits-count"
        id="habitsCount"
      >
        0 HABITS
      </div>

    </div>

/* =========================================================

========================================================= */

function setSaveStatus(state){

    document.getElementById(

    );

  if(!pill) return;

  pill.className =
    'save-pill' +

    );

      : state === 'error'

        ? '<span class="dot"></span> Save failed'

        : '<span class="dot"></span> Saved';

}


/* =========================================================
   DATE HELPERS
========================================================= */

let TODAY =
  new Date();

TODAY.setHours(
  0,0,0,0
);


/*
   Keep TODAY in sync with the
   real calendar date. Without this,
   a tab left open across midnight
   keeps treating the previous day
   as "today" until it's refreshed.
*/

function scheduleMidnightRollover(){

  const now =
    new Date();

  const nextMidnight =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()+1,
      0,0,1
    );

  const msUntilMidnight =
    nextMidnight.getTime() -
    now.getTime();

  setTimeout(
    async ()=>{

      const wasOnTodaysWeek =
        dateKey(currentWeekStart) ===
        dateKey(startOfWeek(TODAY));

      TODAY =
        new Date();

      TODAY.setHours(
        0,0,0,0
      );

      /*
        Only jump the visible week
        forward if the user was
        already looking at the week
        containing "today" — don't
        yank them away from a week
        they navigated to manually.
      */

      if(wasOnTodaysWeek){

        currentWeekStart =
          startOfWeek(TODAY);

      }

      await loadWeek();

      scheduleMidnightRollover();

    },
    msUntilMidnight
  );

}


/*
   Current selected week.
   Always starts Monday.
*/

function startOfWeek(date){

  const d =
    new Date(date);

  d.setHours(
    0,0,0,0
  );

  const day =
    d.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(
    d.getDate() + diff
  );

  return d;

}


let currentWeekStart =
  startOfWeek(TODAY);

/* =========================================================
   DATA
========================================================= */

let habitsList = [];

let completionsMap = {};

let savedDaysMap = {};


/*
  key:

  habitId-YYYY-MM-DD

  value:

  done
  missed
*/


/* =========================================================
   DATE KEY
========================================================= */

function dateKey(date){

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth()+1
    ).padStart(2,'0');

  const d =
    String(
      date.getDate()
    ).padStart(2,'0');

  return `${y}-${m}-${d}`;

}
function isDaySaved(dateKeyValue){

  return !!savedDaysMap[dateKeyValue];

}

/* =========================================================
   FORMAT DATE
========================================================= */

function formatShortDate(date){

  return date.toLocaleDateString(
    'en-US',
    {
      month:'short',
      day:'numeric'
    }
  );

}


/* =========================================================
   ADD DAYS
========================================================= */

function addDays(date,n){

  const d =
    new Date(date);

  d.setDate(
    d.getDate()+n
  );

  return d;

}


/* =========================================================
   FETCH MONTH
========================================================= */

async function fetchMonth(
  year,
  month
){

  try{

    return await api.get(
      `/betterme/month?year=${year}&month=${month}`
    );

  }catch(err){

    console.error(
      'BetterMe month error:',
      err
    );

    return {
      habits:[],
      completions:[]
    };

  }

}


/* =========================================================
   LOAD WEEK
========================================================= */

async function loadWeek(){

  setSaveStatus(
    'saving'
  );

  try{

    /*
      A week can cross two months.
      Fetch both.
    */

    const firstMonth =
      await fetchMonth(
        currentWeekStart.getFullYear(),
        currentWeekStart.getMonth()+1
      );

    const lastDay =
      addDays(
        currentWeekStart,
        6
      );

    let secondMonth = null;

    if(
      firstMonth &&
      (
        lastDay.getFullYear()
          !==
        currentWeekStart.getFullYear()
        ||
        lastDay.getMonth()
          !==
        currentWeekStart.getMonth()
      )
    ){

      secondMonth =
        await fetchMonth(
          lastDay.getFullYear(),
          lastDay.getMonth()+1
        );

    }


    habitsList =
      firstMonth.habits ||
      (
        secondMonth
          ? secondMonth.habits
          : []
      ) ||
      [];


    completionsMap = {};

savedDaysMap = {};


    function addCompletions(data){

      if(
        !data ||
        !data.completions
      )
        return;


      data.completions.forEach(
        c=>{

          const key =
            `${c.habit_id}-${c.entry_date}`;

          completionsMap[key] =
            c.status;

        }
      );

    }

    function addSavedDays(data){

  if(
    !data ||
    !data.savedDays
  )
    return;


  data.savedDays.forEach(
    day => {

      const key =
        String(day.entry_date)
          .slice(0, 10);

      savedDaysMap[key] = true;

    }
  );

    }


    addCompletions(
  firstMonth
);

addCompletions(
  secondMonth
);

addSavedDays(
  firstMonth
);

addSavedDays(
  secondMonth
);


    renderEverything();

    setSaveStatus(
      'saved'
    );

  }catch(err){

    console.error(err);

    setSaveStatus(
      'error'
    );

  }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}

   RENDER TRACKER
========================================================= */

function renderTracker(){

/* =========================================================
   RENDER ONE DAY
========================================================= */

function renderDayColumn(date){

  const key =
    dateKey(date);

  const saved =
    isDaySaved(key);

  const today =
    key ===
    dateKey(TODAY);

  const future =
    date.getTime() >
    TODAY.getTime();


  let doneCount = 0;

  let missedCount = 0;


  let dots = '';


  habitsList.forEach(
    (habit,index)=>{

      const status =
        completionsMap[
          `${habit.id}-${key}`
        ];


      if(status === 'done')
        doneCount++;


      if(status === 'missed')
        missedCount++;


      dots +=
        `
          <div class="dot-row">

            <div
              class="habit-dot ${status || ''}"
              data-habit="${habit.id}"
              data-date="${key}"
              title="${index+1}. ${escapeHTML(habit.name)}"
            >
              ${index+1}
            </div>

          </div>
        `;

    }
  );


  const total =
    habitsList.length;


  const percentage =
    total
      ? Math.round(
          doneCount /
          total *
          100
        )
      : 0;


  const percentColor =
    percentage >= 70
      ? '#4ade80'
      : percentage >= 40
        ? '#fbbf24'
        : '#fb7185';


  return `

    <div
      class="
        day-column
        ${today ? 'today' : ''}
        ${saved ? 'locked' : ''}
        ${future ? 'future' : ''}
      "
      data-day-column="${key}"
    >

      <div class="day-header">

        <div class="day-name">
          ${
            date.toLocaleDateString(
              'en-US',
              {
                weekday:'short'
              }
            )
          }
        </div>

        <div class="day-date">
          ${formatShortDate(date)}
        </div>

        <div
          class="day-percent"
          style="color:${percentColor}"
        >
          ${percentage}%
        </div>

      </div>


      <div class="dot-track">

        ${dots}

      </div>


      <button
  class="
    save-day-btn
    ${saved ? 'locked' : ''}
  "
  data-save-day="${key}"
  ${saved ? 'disabled' : ''}
>
  ${
    saved
      ? '🔒 Saved Day'
      : '✓ Save Day'
  }
</button>

    </div>

  `;

}

   ATTACH DOT EVENTS

function attachDotEvents(){

/* =========================================================
   TOGGLE DOT
========================================================= */

async function toggleHabitDot(dot){

  const habitId =
    Number(dot.dataset.habit);

  const date =
    dot.dataset.date;


  /*
    Day already saved?
    It cannot be changed.
  */

  if(isDaySaved(date)){
    return;
  }


  /*
    Current status
  */

  const key =
    `${habitId}-${date}`;

  const currentStatus =
    completionsMap[key] || null;


  /*
    Cycle:

    empty → done
    done  → missed
    missed → empty
  */

  let nextStatus = null;

  if(currentStatus === null){

    nextStatus = 'done';

  }
  else if(currentStatus === 'done'){

    nextStatus = 'missed';

  }
  else if(currentStatus === 'missed'){

    nextStatus = null;

  }


  setSaveStatus('saving');


  try{

    /*
      Empty status means remove
      the completion for this habit/day.
    */

    if(nextStatus === null){

      await api.delete(
        `/betterme/completions/${habitId}/${date}`
      );

      delete completionsMap[key];

    }
    else{

      await api.post(
        '/betterme/completions',
        {
          habit_id:habitId,
          entry_date:date,
          status:nextStatus
        }
      );

      completionsMap[key] =
        nextStatus;

    }


    /*
      Refresh UI.
    */

    renderTracker();

    updateMotivation();

    setSaveStatus('saved');


  }catch(err){

    console.error(
      'Toggle habit error:',
      err
    );

    setSaveStatus('error');

  }

  }

/* =========================================================

function renderWeekSlider(){

  const slider =
    document.getElementById(
      'weekSlider'
    );


  /*
    Show several weeks around

    html +=

              )
            }

            class="wc-score"

  slider.innerHTML =

  slider
    .querySelectorAll(

    )

      chip.addEventListener(

            );

          currentWeekStart =
            startOfWeek(

            );

          await loadWeek();

        }
      );

    });


  const active =
    slider.querySelector(

    );


  if(active){

    active.scrollIntoView({
      behavior:'smooth',
      inline:'center',
      block:'nearest'
    });

  }

}


/* =========================================================
   WEEK SCORE
========================================================= */

function calculateWeekScore(
  weekStart
){

  if(!habitsList.length)
    return 0;


  let done = 0;

  let possible = 0;


  for(
    let i=0;
    i<7;
    i++
  ){

    const date =
      addDays(
        weekStart,
        i
      );

    const key =
      dateKey(date);


    habitsList.forEach(
      habit=>{

        const status =
          completionsMap[
            `${habit.id}-${key}`
          ];


        if(status){

          possible++;

          if(status === 'done')
            done++;

        }

      }
    );

  }


  if(!possible)
    return 0;


  return Math.round(
    done /
    possible *
    100
  );

}


/* =========================================================
   MOTIVATION
========================================================= */

function updateMotivation(){

  let totalDone = 0;

  let totalMarked = 0;

  let lockedDays = 0;


  for(
    let i=0;
    i<7;
    i++
  ){

    const date =
      addDays(
        currentWeekStart,
        i
      );

    const key =
      dateKey(date);


    if(
      isDaySaved(key)
    ){

      lockedDays++;

    }


    habitsList.forEach(
      habit=>{

        const status =
          completionsMap[
            `${habit.id}-${key}`
          ];


        if(status){

          totalMarked++;

          if(status === 'done')
            totalDone++;

        }

      }
    );

  }


  const score =
    totalMarked
      ? Math.round(
          totalDone /
          totalMarked *
          100
        )
      : 0;


  const main =
    document.getElementById(
      'motivationMain'
    );

  const sub =
    document.getElementById(
      'motivationSub'
    );


  if(score >= 90){

    main.textContent =
      '🔥 This week is on fire.';

    sub.textContent =
      `${score}% completion. Keep the green line alive.`;

  }

  else if(score >= 70){

    main.textContent =
      '🟢 You are building momentum.';

    sub.textContent =
      `${score}% complete. Push the remaining habits.`;

  }

  else if(score >= 40){

    main.textContent =
      '⚡ Keep going. More green is waiting.';

    sub.textContent =
      `${score}% complete. One habit at a time.`;

  }

  else if(lockedDays > 0){

    main.textContent =
      '🔒 You showed up. Keep building.';

    sub.textContent =
      `${lockedDays} day${lockedDays > 1 ? 's' : ''} permanently saved.`;

  }

  else{

    main.textContent =
      '🌱 Start building your green line.';

    sub.textContent =
      'Complete your habits and save the day when you are done.';

  }

}

            }

          </div>
        `;

      }
    ).join('');


  attachGoalEvents();

}


/* =========================================================
   GOAL EVENTS
========================================================= */

function attachGoalEvents(){

  document
    .querySelectorAll(
      '[data-complete-goal]'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        () => completeGoal(
          Number(
            button.dataset.completeGoal
          )
        )
      );

    });


  document
    .querySelectorAll(
      '[data-edit-goal]'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        () => editGoal(
          Number(
            button.dataset.editGoal
          )
        )
      );

    });


  document
    .querySelectorAll(
      '[data-delete-goal]'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        () => deleteGoal(
          Number(
            button.dataset.deleteGoal
          )
        )
      );

    });

}


/* =========================================================
   COMPLETE GOAL
========================================================= */

async function completeGoal(id){

  try{

    await api.post(
      `/betterme/goals/${id}/complete`
    );

    await loadGoals();

  }catch(err){

    console.error(
      'Complete goal error:',
      err
    );

    alert(
      'Could not complete the goal.'
    );

  }

}


/* =========================================================
   ADD GOAL
========================================================= */

async function addNewGoal(){

  const title =
    prompt(
      'Goal name:'
    );

  if(
    !title ||
    !title.trim()
  )
    return;


  let deadline =
    prompt(
      'Deadline (YYYY-MM-DD) — optional:'
    );


  if(
    deadline &&
    !/^\d{4}-\d{2}-\d{2}$/.test(
      deadline
    )
  ){

    alert(
      'Use YYYY-MM-DD format.'
    );

    return;

  }


  try{

    await api.post(
      '/betterme/goals',
      {
        title:title.trim(),
        goal_type:activeGoalType,
        deadline:deadline || null,
        reward:null
      }
    );

    await loadGoals();

  }catch(err){

    console.error(
      'Add goal error:',
      err
    );

    alert(
      'Could not add goal.'
    );

  }

}


/* =========================================================
   EDIT GOAL
========================================================= */

async function editGoal(id){

  const goal =
    goalsList.find(
      item =>
        Number(item.id) === Number(id)
    );

  if(!goal)
    return;


  const title =
    prompt(
      'Edit goal:',
      goal.title
    );


  if(
    !title ||
    !title.trim()
  )
    return;


  const deadline =
    prompt(
      'Deadline (YYYY-MM-DD) — optional:',
      goal.deadline || ''
    );


  if(
    deadline &&
    !/^\d{4}-\d{2}-\d{2}$/.test(
      deadline
    )
  ){

    alert(
      'Use YYYY-MM-DD format.'
    );

    return;

  }


  try{

    await api.put(
      `/betterme/goals/${id}`,
      {
        title:title.trim(),
        goal_type:goal.goal_type,
        deadline:deadline || null,
        reward:goal.reward || null
      }
    );

    await loadGoals();

  }catch(err){

    console.error(
      'Edit goal error:',
      err
    );

    alert(
      'Could not update the goal.'
    );

  }

}


/* =========================================================
   DELETE GOAL
========================================================= */

async function deleteGoal(id){

  const confirmed =
    confirm(
      'Delete this goal?'
    );

  if(!confirmed)
    return;


  try{

    await api.delete(
      `/betterme/goals/${id}`
    );

    await loadGoals();

  }catch(err){

    console.error(
      'Delete goal error:',
      err
    );

    alert(
      'Could not delete the goal.'
    );

  }

}


/* =========================================================
   GOAL TABS
========================================================= */

document
  .querySelectorAll(
    '.goal-tab'
  )
  .forEach(tab => {

    tab.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll(
            '.goal-tab'
          )
          .forEach(
            item =>
              item.classList.remove(
                'active'
              )
          );

        tab.classList.add(
          'active'
        );

        activeGoalType =
          tab.dataset.type;

        renderGoals();

      }
    );

  });


/* =========================================================
   ADD GOAL BUTTON
========================================================= */

document
  .getElementById(
    'addGoalBtn'
  )
  .addEventListener(
    'click',
    addNewGoal
  );


/* =========================================================
   LOAD GOALS
========================================================= */

loadGoals();
</script>

</html>
