<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vision — Northern Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#050B14;color:#fff;font-family:'Poppins',sans-serif;overflow-x:hidden;}
body{padding-bottom:40px;position:relative;}

/* ============ Signature: drifting aurora ribbons ============ */
.aurora-field{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.aurora-field .ribbon{position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; mix-blend-mode:screen;}
.aurora-field .r1{width:520px; height:320px; top:-140px; left:-120px; background:radial-gradient(ellipse,#5EEAD4,transparent 70%); animation:driftA 22s ease-in-out infinite;}
.aurora-field .r2{width:460px; height:300px; top:60px; right:-160px; background:radial-gradient(ellipse,#818CF8,transparent 70%); animation:driftB 26s ease-in-out infinite;}
.aurora-field .r3{width:420px; height:280px; top:340px; left:20%; background:radial-gradient(ellipse,#4ADE80,transparent 70%); animation:driftC 30s ease-in-out infinite;}
@keyframes driftA{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,30px) scale(1.1);}}
@keyframes driftB{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,40px) scale(1.08);}}
@keyframes driftC{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-25px) scale(1.06);}}

.app-shell {
  position: relative;
}

.stat-header{display:flex; align-items:center; gap:14px; padding:18px 16px; max-width:640px; margin:0 auto;}
.avatar-ring{width:56px; height:56px; border-radius:50%; padding:3px; background:conic-gradient(#5EEAD4,#818CF8,#F472B6,#5EEAD4); flex-shrink:0;}
.avatar-ring .inner{width:100%; height:100%; border-radius:50%; background:#081A22; display:flex; align-items:center; justify-content:center; font-size:22px;}
.stat-header .name{font-weight:800; font-size:15px; color:#EAF6F3;}
.stat-header .sub{font-size:10.5px; color:#7FA79E; margin-top:2px;}
.stat-pills{margin-left:auto; display:flex; gap:8px;}
.pill{background:rgba(94,234,212,0.10); border:1px solid rgba(94,234,212,0.30); color:#5EEAD4; border-radius:999px; padding:6px 12px; font-size:10.5px; font-weight:700; display:flex; align-items:center; gap:5px; white-space:nowrap;}

.vcard{position:relative; border-radius:20px; overflow:hidden; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,0.5); transition:transform .15s ease;}
.vcard img{width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0;}
.vcard .shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.85) 100%);}
.vcard .rim{position:absolute; inset:0; border-radius:20px; border:2px solid transparent; pointer-events:none;}
.vcard .badge-tag{position:absolute; top:10px; right:10px; font-size:14px; background:rgba(5,11,20,0.55); backdrop-filter:blur(4px); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:3;}
.vcard:active{transform:scale(.95);}

.vmodal{position:fixed; inset:0; background:rgba(3,9,16,0.93); display:none; align-items:center; justify-content:center; z-index:999; padding:20px;}
.vmodal.show{display:flex;}
.vmodal-card{width:100%; max-width:340px; border-radius:24px; overflow:hidden; background:#0B222A; border:1px solid rgba(94,234,212,0.18); box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.vmodal-photo{width:100%; height:200px; object-fit:cover; display:block;}
.vmodal-body{padding:20px;}
.vmodal-body h3{font-family:'Cinzel',serif; font-size:17px; margin-bottom:6px; color:#EAF6F3;}
.vmodal-body .tag{font-size:11px; color:#5EEAD4; margin-bottom:14px;}
.vmodal-body button{width:100%; padding:12px; border-radius:12px; border:1px solid rgba(94,234,212,0.3); background:rgba(94,234,212,0.10); color:#EAF6F3; font-weight:700; cursor:pointer;}

.vquote{max-width:640px; margin:26px auto; text-align:center; padding:20px; border-radius:18px; border:1px solid rgba(94,234,212,0.20); background:rgba(94,234,212,0.06);}
.vquote p{font-size:14px; font-weight:700; line-height:1.6; color:#CFFFF6;}

/* ================= NORTHERN PATH ================= */
.path-wrap{position:relative; max-width:640px; margin:0 auto; padding:10px 16px 30px;}
.path-dest{text-align:center; padding:18px 0 26px; position:relative; z-index:2;}
.path-dest .glow-castle{width:70px; height:70px; margin:0 auto 8px; border-radius:50%;
  background:radial-gradient(circle,#CFFFF6,#5EEAD4 55%,transparent 100%);
  box-shadow:0 0 50px 16px rgba(94,234,212,.45); display:flex; align-items:center; justify-content:center; font-size:28px;
  animation:destPulse 3s ease-in-out infinite;}
@keyframes destPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.08);}}
.path-dest h2{font-family:'Cinzel',serif; font-weight:800; color:#EAF6F3; text-shadow:0 0 18px rgba(94,234,212,.35); font-size:18px; margin-top:6px; letter-spacing:.02em;}
.path-row{display:flex; align-items:center; gap:14px; position:relative; z-index:2; margin-bottom:26px;}
.path-row.right{flex-direction:row-reverse;}
.p-card{width:96px; height:96px; border-radius:50%; flex-shrink:0; border:3px solid rgba(94,234,212,0.28);}
.p-card .badge-tag{border-radius:50%; top:-4px; right:-4px;}
.p-info{flex:1; text-align:left;}
.path-row.right .p-info{text-align:right;}
.p-info .t{font-size:12.5px; font-weight:800; color:#EAF6F3;}
.p-info .s{font-size:9px; color:#7FA79E; font-family:monospace; margin-top:2px;}

.trail-walker{text-align:center; font-size:28px; filter:drop-shadow(0 0 10px rgba(94,234,212,.4));}
</style>
</head>
<body>

<div class="aurora-field">
  <div class="ribbon r1"></div>
  <div class="ribbon r2"></div>
  <div class="ribbon r3"></div>
</div>

<div class="app-shell">

<div class="stat-header">
  <div class="avatar-ring"><div class="inner">🧑</div></div>
  <div>
    <div class="name">My Vision</div>
    <div class="sub">My future already exists. I'm walking toward it.</div>
  </div>
  <div class="stat-pills">
    <div class="pill">🔥 <span id="p-streak">0</span>d</div>
  </div>
</div>

<div class="path-wrap" id="pathWrap">
  <div class="path-dest">
    <div class="glow-castle">🏔️</div>
    <h2>THE LIFE I'M BUILDING</h2>
  </div>
  <div id="pathRows"></div>
  <div class="trail-walker">🚶</div>
</div>

<div class="vquote">
  <p>"I become what I repeatedly believe."</p>
</div>

<div class="vmodal" id="vModal">
  <div class="vmodal-card">
    <img class="vmodal-photo" id="vmPhoto" src="" alt="">
    <div class="vmodal-body">
      <h3 id="vmTitle"></h3>
      <div class="tag" id="vmTag"></div>
      <button id="vmClose">Close</button>
    </div>
  </div>
</div>

</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
const VISIONS = [
  { icon:'🛡️', label:'₹1,00,000 Emergency Fund', sub:'Financial Security First', color:'#5EEAD4', photo:'https://images.unsplash.com/photo-1607863680198-23d4b2565df0?auto=format&fit=crop&w=800&q=75' },
  { icon:'📈', label:'Invest ₹20,000/mo', sub:'Grow Wealth. Create Freedom.', color:'#4ADE80', photo:'https://images.unsplash.com/photo-1633158829875-e5316a358c6f?auto=format&fit=crop&w=800&q=75' },
  { icon:'💹', label:'SIP ₹15,000/mo', sub:'Flexi-Cap + Nifty 50', color:'#38BDF8', photo:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=800&q=75' },
  { icon:'🏥', label:'₹1Cr Term + Health Cover', sub:'Protect What Matters Most', color:'#38BDF8', photo:'images/insurance.jpg' },
  { icon:'📚', label:'1 Book Every Month', sub:'Knowledge = Power', color:'#A78BFA', photo:'https://images.unsplash.com/photo-1754697831323-6d51e460ba8f?auto=format&fit=crop&w=800&q=75' },
  { icon:'💻', label:'High-Income Digital Skill', sub:'Future-Proof My Income', color:'#818CF8', photo:'https://images.unsplash.com/photo-1607970669494-309137683be5?auto=format&fit=crop&w=800&q=75' },
  { icon:'🤝', label:'Help Orphans & Old Age Homes', sub:'Service Is True Success', color:'#F472B6', photo:'images/oldage.jpg' },
  { icon:'🐄', label:'Donate to a Gau Shala', sub:'Gratitude. Giving. Blessings.', color:'#F472B6', photo:'images/gaushala.jpg' },
  { icon:'🏡', label:'Bungalow in Chincholi', sub:'A Home. A Legacy.', color:'#5EEAD4', photo:'https://images.unsplash.com/photo-1757359056339-22968344cce6?auto=format&fit=crop&w=800&q=75' },
  { icon:'💪', label:'Fit, 6-Abs Body', sub:'Discipline Today. Freedom Tomorrow.', color:'#4ADE80', photo:'images/abs.jpg' },
  { icon:'🧠', label:'Master AI, Leadership & English', sub:'Be Exceptional. Lead. Inspire.', color:'#A78BFA', photo:'https://images.unsplash.com/photo-1760199789455-49098afd02f0?auto=format&fit=crop&w=800&q=75' },
];

const vModal = document.getElementById('vModal');
function openDetail(v){
  document.getElementById('vmPhoto').src = v.photo;
  document.getElementById('vmTitle').textContent = v.label;
  document.getElementById('vmTag').textContent = v.sub;
  vModal.classList.add('show');
}
document.getElementById('vmClose').addEventListener('click', ()=>vModal.classList.remove('show'));
vModal.addEventListener('click', (e)=>{ if(e.target===vModal) vModal.classList.remove('show'); });

const pathRows = document.getElementById('pathRows');
VISIONS.forEach((v,i)=>{
  const row = document.createElement('div');
  row.className = 'path-row' + (i%2===1 ? ' right' : '');
  row.innerHTML = `
    <div class="vcard p-card" style="--c:${v.color};">
      <img src="${v.photo}" alt="${v.label}">
      <div class="shade"></div>
      <div class="rim" style="box-shadow:inset 0 0 0 2px ${v.color}88;"></div>
      <div class="badge-tag">${v.icon}</div>
    </div>
    <div class="p-info">
      <div class="t">${v.label}</div>
      <div class="s">${v.sub}</div>
    </div>
  `;
  const card = row.querySelector('.p-card');
  card.addEventListener('click', ()=>openDetail(v));
  pathRows.appendChild(row);
});
document.getElementById('p-streak').textContent = 0;
</script>
</body>
</html>
