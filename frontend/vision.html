<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS — Vision Board</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/vision.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header fade-up">
      <div>
        <div class="eyebrow">Private</div>
        <h1>Vision Board</h1>
      </div>
    </div>

    <div id="vision-grid" class="fade-up fade-up-1"></div>

    <form class="card vision-form-card fade-up fade-up-2" id="vision-form">
      <div class="card-title"><h3>Add a dream</h3></div>

      <div class="field-row">
        <label for="title">Title</label>
        <input type="text" id="title" required>
      </div>
      <div class="field-row">
        <label for="description">Description</label>
        <textarea id="description" rows="2"></textarea>
      </div>
      <div class="field-row">
        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. finance, health, lifestyle">
      </div>
      <div class="field-row">
        <label for="image_url">Image URL (optional)</label>
        <input type="text" id="image_url" placeholder="https://…">
      </div>

      <button type="submit" class="btn-primary" style="width:100%">Add to board</button>
    </form>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/vision.js"></script>
</body>
</html>
