<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Standards</title>

<link rel="stylesheet" href="css/daily-standards.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

<header>

<button class="icon-btn">
<i class="fa-solid fa-bars"></i>
</button>

<div class="title">

<h1>Daily Standards</h1>

<p id="todayDate"></p>

</div>

<div class="actions">

<button class="icon-btn" id="manageHabitsBtn">
<i class="fa-solid fa-pen"></i>
</button>

<button class="icon-btn">
<i class="fa-solid fa-calendar"></i>
</button>

</div>

</header>

<div id="habitList"></div>

<section class="summary">

<div class="mini-card">

<i class="fa-solid fa-arrow-trend-up"></i>

<p>Best Score</p>

<h2 id="bestScore">10/10</h2>

</div>

<div class="ring-card">

<div class="ring">

<div class="ring-center">

<span>TODAY'S AVERAGE</span>

<h2 id="averageScore">8.3/10</h2>

<div class="pill" id="averagePercent">
83%
</div>

</div>

</div>

</div>

<div class="mini-card">

<i class="fa-solid fa-fire"></i>

<p>Current Streak</p>

<h2 id="streak">
17
</h2>

<span>days</span>

</div>

</section>

<section class="quote-card">

<div class="quote-icon">

❝

</div>

<h2>

Small improvements every day create

</h2>

<h1>

extraordinary results.

</h1>

<div class="mountain">

🏔️────────────🚩

</div>

</section>

</div>

<script src="js/daily-standards.js"></script>

<div id="habitModal" class="modal">

  <div class="modal-content">

    <h2>Manage Habits</h2>

    <div id="habitEditor"></div>

    <button id="addHabitBtn" class="primary-btn">
      ➕ Add Habit
    </button>

    <button id="closeModal" class="secondary-btn">
      Done
    </button>

  </div>

</div>

</body>
</html>
