<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS — Daily Standards</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/standards.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header fade-up">
      <div>
        <div class="eyebrow">Discipline</div>
        <h1>Daily Standards</h1>
      </div>
    </div>

    <div class="grid grid-2">
      <form class="card fade-up fade-up-1" id="standards-form">
        <div class="card-title"><h3>Rate today (0–10)</h3></div>
        <div id="sliders"></div>

        <div class="live-average-row">
          <span class="stat-label">Today's average</span>
          <span class="numeric" id="live-average">—</span>
        </div>

        <button type="submit" class="btn-primary" style="width:100%">Save today's standards</button>
      </form>

      <div class="card fade-up fade-up-2">
        <div class="card-title"><h3>Last 14 days</h3></div>
        <div id="history-list"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/standards.js"></script>
</body>
</html>
